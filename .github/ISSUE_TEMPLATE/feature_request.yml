name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe the user-visible result, not only an implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Provider compatibility
      description: Note whether this is generic S3 behavior or provider-specific.

