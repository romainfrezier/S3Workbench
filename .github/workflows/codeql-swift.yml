name: CodeQL Swift

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    paths:
      - '**/*.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'Integration/**'
      - 'Packaging/**'
      - 'Assets/**'
      - 'scripts/**'
      - '.github/workflows/codeql-swift.yml'
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']
    types: [opened, synchronize, reopened, edited]
    paths:
      - '**/*.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'Integration/**'
      - 'Packaging/**'
      - 'Assets/**'
      - 'scripts/**'
      - '.github/workflows/codeql-swift.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build Swift package
        run: swift build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
