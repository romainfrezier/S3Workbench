name: Website image

on:
  push:
    branches: [main]
    tags: ['v*.*.*', 'v*.*.*-site']
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-image.yml'

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/romainfrezier/s3workbench-site

jobs:
  website:
    name: Validate website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and SEO checks
        run: npm run build && npm run test

      - name: Build container
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          push: false
          build-args: |
            VITE_SITE_URL=https://s3workbench.com
            VITE_BASE_PATH=/

  publish:
    name: Publish website image
    if: github.event_name == 'push'
    needs: website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=match,pattern=v(.*)-site,group=1

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SITE_URL=https://s3workbench.com
            VITE_BASE_PATH=/
