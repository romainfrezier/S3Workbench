name: ${COMPOSE_PROJECT_NAME:-s3workbench-integration}

services:
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-s3workbench}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-s3workbench-secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 1s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-s3workbench}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-s3workbench-secret}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET:-s3workbench-tests}
      MINIO_RESTRICTED_USER: ${MINIO_RESTRICTED_USER:-s3workbench-restricted}
      MINIO_RESTRICTED_PASSWORD: ${MINIO_RESTRICTED_PASSWORD:-s3workbench-restricted-secret}
    volumes:
      - ./init-minio.sh:/init-minio.sh:ro
      - ./restricted-policy.json:/restricted-policy.json:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]

volumes:
  minio-data:
