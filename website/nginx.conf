server {
    listen 80;
    server_name _;
    server_tokens off;
    # Keep the original scheme when TLS terminates at the reverse proxy.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/xml;
    add_header_inherit merge;
    # The build substitutes hashes for the inline stylesheet.
    add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src __STYLE_HASHES__; img-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { types { application/xml xml; } try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /screenshots/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
